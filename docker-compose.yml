services:
  db:
    image: groonga/pgroonga:4.0.6-alpine-18
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p 5432 -q -U $${POSTGRES_USER}
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    image: ${XIAGEBA_IMAGE:-xiageba:latest}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5736:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
